<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favInfinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="favLeafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background rounded square -->
  <rect width="100" height="100" rx="28" fill="#0F172A" />

  <g transform="translate(0, 20)">
    <!-- Infinity loop path -->
    <path
      d="M30 30 C15 15, 5 22, 5 30 C5 38, 15 45, 30 30 C45 15, 55 15, 70 30 C85 45, 95 38, 95 30 C95 22, 85 15, 70 30 C55 45, 45 45, 30 30 Z"
      stroke="url(#favInfinityGrad)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#favGlow)"
    />

    <!-- Merged Dumbbell Center Bar -->
    <line x1="42" y1="30" x2="58" y2="30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    
    <!-- Dumbbell Inner Plates -->
    <rect x="39" y="22" width="4" height="16" rx="2" fill="#FFFFFF" />
    <rect x="57" y="22" width="4" height="16" rx="2" fill="#FFFFFF" />

    <!-- Dumbbell Outer Plates -->
    <rect x="35" y="24" width="3" height="12" rx="1.5" fill="#22C55E" />
    <rect x="62" y="24" width="3" height="12" rx="1.5" fill="#22C55E" />

    <!-- Leaf Accent overlay on right loop -->
    <path
      d="M75 18 C82 12, 90 15, 88 23 C85 30, 77 28, 75 18 Z"
      fill="url(#favLeafGrad)"
      opacity="0.9"
    />
    <path
      d="M77 20 Q83 18 86 22"
      stroke="#ffffff"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </g>
</svg>
<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>InfinityFitAI - Transform Your Health with AI</title>
    
    <!-- Meta Descriptions & SEO -->
    <meta name="description" content="InfinityFitAI - Personalized nutrition, AI meal planning, workout guidance, and BMI calculator. Built with high precision algorithms." />
    <meta name="keywords" content="InfinityFitAI, BMI Calculator, Meal Planner, Workout Planner, Nutrition Calculator, Calorie Counter" />
    <meta name="author" content="InfinityFitAI Health Technologies" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://infinityfit.ai/" />
    <meta property="og:title" content="InfinityFitAI - Transform Your Health with AI" />
    <meta property="og:description" content="Personalized nutrition. AI meal planning. Workout guidance. BMI calculator." />

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://infinityfit.ai/" />
    <meta name="twitter:title" content="InfinityFitAI - Transform Your Health with AI" />
    <meta name="twitter:description" content="Personalized nutrition, AI meal planning, workout guidance, and BMI calculator." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "InfinityFitAI",
      "url": "https://infinityfit.ai",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "All",
      "description": "Smart Fitness & Nutrition Platform with AI meal planning and workout guidance.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-white text-[#111827] font-sans antialiased selection:bg-[#22C55E] selection:text-white transition-colors duration-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed: ', err));
        });
      }
    </script>
  </body>
</html>
